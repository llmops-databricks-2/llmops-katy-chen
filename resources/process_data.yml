resources:
  jobs:
    data-pipeline:
      name: ingest-recipie-data-pipeline

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Amsterdam"

      budget_policy_id: "${var.usage_policy_id}"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: ingest_recipie_data
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_ingest_recipie_data.py
            base_parameters:
              env: "${bundle.target}"
